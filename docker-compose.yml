name: "memoh"
services:
  postgres:
    image: postgres:18-alpine
    container_name: sophia-postgres
    environment:
      POSTGRES_DB: memoh
      POSTGRES_USER: memoh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memoh123}
    volumes:
      - postgres_data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sophia"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sophia-network

  pgvector:
    image: pgvector/pgvector:pg18
    container_name: sophia-pgvector
    environment:
      POSTGRES_DB: memoh_vector
      POSTGRES_USER: memoh
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-${POSTGRES_PASSWORD:-memoh123}}
    volumes:
      - pgvector_data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sophia -d sophia_vector"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sophia-network

  migrate:
    image: sophiaai/server:latest
    container_name: sophia-migrate
    entrypoint: ["/app/sophia-server", "migrate", "up"]
    volumes:
      - ${SOPHIA_CONFIG:-./config.toml}:/app/config.toml:ro
      - memoh_data:/opt/sophia/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - sophia-network

  server:
    image: sophiaai/server:latest
    container_name: sophia-server
    privileged: true
    pid: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Proxy: use host.docker.internal for localhost proxies, e.g.
      #   HTTP_PROXY=http://host.docker.internal:7890 docker compose up -d
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},postgres,pgvector,server,channel,web,migrate,webhook-tunnel,connect-it,sophia-postgres,sophia-pgvector,sophia-server,sophia-channel,sophia-web,sophia-migrate,sophia-webhook-tunnel,sophia-connect-it"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},postgres,pgvector,server,channel,web,migrate,webhook-tunnel,connect-it,sophia-postgres,sophia-pgvector,sophia-server,sophia-channel,sophia-web,sophia-migrate,sophia-webhook-tunnel,sophia-connect-it"
      SOPHIA_INTERNAL_RPC_SHARED_SECRET: "${SOPHIA_INTERNAL_RPC_SHARED_SECRET:?SOPHIA_INTERNAL_RPC_SHARED_SECRET is required}"
      SOPHIA_INTERNAL_RPC_SERVER_TARGET: "server:9090"
      SOPHIA_INTERNAL_RPC_CHANNEL_TARGET: "channel:9091"
      SOPHIA_CONNECT_IT_BASE_URL: "${SOPHIA_CONNECT_IT_BASE_URL:-}"
      SOPHIA_CONNECT_IT_API_TOKEN: "${SOPHIA_CONNECT_IT_API_TOKEN:-}"
      SOPHIA_DISPLAY_WEBRTC_UDP_PORT_MIN: "${SOPHIA_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}"
      SOPHIA_DISPLAY_WEBRTC_UDP_PORT_MAX: "${SOPHIA_DISPLAY_WEBRTC_UDP_PORT_MAX:-30100}"
      GODEBUG: "tlskyber=0"
    volumes:
      - ${SOPHIA_CONFIG:-./config.toml}:/app/config.toml:ro
      - ./conf/providers:/app/conf/providers:ro
      - containerd_data:/var/lib/containerd
      - server_cni_state:/var/lib/cni
      - memoh_data:/opt/sophia/data
      # Expose host CDI specs to the nested containerd used for bot workspaces.
      - /etc/cdi:/etc/cdi:ro
      - /var/run/cdi:/var/run/cdi:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8080:8080"
      - "1455:8080"
      - "${SOPHIA_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}-${SOPHIA_DISPLAY_WEBRTC_UDP_PORT_MAX:-30100}:${SOPHIA_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}-${SOPHIA_DISPLAY_WEBRTC_UDP_PORT_MAX:-30100}/udp"
    expose:
      - "9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgvector:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sophia-network

  channel:
    image: sophiaai/server:latest
    container_name: sophia-channel
    entrypoint: ["/app/sophia-channel", "serve"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},postgres,server,channel,webhook-tunnel,sophia-postgres,sophia-server,sophia-channel,sophia-webhook-tunnel"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},postgres,server,channel,webhook-tunnel,sophia-postgres,sophia-server,sophia-channel,sophia-webhook-tunnel"
      SOPHIA_INTERNAL_RPC_SHARED_SECRET: "${SOPHIA_INTERNAL_RPC_SHARED_SECRET:?SOPHIA_INTERNAL_RPC_SHARED_SECRET is required}"
      SOPHIA_INTERNAL_RPC_SERVER_TARGET: "server:9090"
      SOPHIA_INTERNAL_RPC_CHANNEL_TARGET: "channel:9091"
      SOPHIA_WEBHOOK_TUNNEL_MODE: "${SOPHIA_WEBHOOK_TUNNEL_MODE:-}"
      SOPHIA_WEBHOOK_PUBLIC_BASE_URL: "${SOPHIA_WEBHOOK_PUBLIC_BASE_URL:-}"
      SOPHIA_WEBHOOK_TUNNEL_LISTEN_ADDR: ":18734"
      SOPHIA_WEBHOOK_TUNNEL_METRICS_URL: "http://webhook-tunnel:18735"
    volumes:
      - ${SOPHIA_CONFIG:-./config.toml}:/app/config.toml:ro
      - memoh_data:/opt/sophia/data
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "8081"
      - "9091"
      - "18734"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Wait for the server so inbound platform messages arriving in the
      # startup window do not fail their turn RPC.
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - sophia-network

  webhook-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sophia-webhook-tunnel
    command: tunnel --no-autoupdate --url http://channel:18734 --metrics 0.0.0.0:18735
    profiles: [webhook-tunnel]
    environment:
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},channel,sophia-channel"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},channel,sophia-channel"
    depends_on:
      - channel
    expose:
      - "18735"
    restart: unless-stopped
    networks:
      - sophia-network

  # Optional co-hosted Connect-It (enable with --profile connectors). It owns
  # and migrates its own connect_it schema inside the shared sophia database;
  # Sophia reaches it over HTTP only. The bootstrap API token is seeded by
  # Connect-It at startup and presented by the Sophia server as its bearer
  # token — the install script generates and persists all of these values.
  connect-it:
    image: "${SOPHIA_CONNECT_IT_IMAGE:-ghcr.io/sophiaai/connect-it:0.1.1}"
    container_name: sophia-connect-it
    profiles: [connectors]
    environment:
      DATABASE_URL: "postgres://memoh:${POSTGRES_PASSWORD:-memoh123}@postgres:5432/memoh?sslmode=disable&search_path=connect_it"
      CONNECT_IT_SECRET_KEY: "${SOPHIA_CONNECT_IT_SECRET_KEY:-}"
      COOKIE_SECRET: "${SOPHIA_CONNECT_IT_COOKIE_SECRET:-}"
      CONNECT_IT_ADMIN_PASSWORD: "${SOPHIA_CONNECT_IT_ADMIN_PASSWORD:-}"
      CONNECT_IT_BOOTSTRAP_API_TOKEN: "${SOPHIA_CONNECT_IT_API_TOKEN:-}"
      CONNECT_IT_BASE_URL: "${SOPHIA_CONNECT_IT_PUBLIC_BASE_URL:-http://localhost:${SOPHIA_CONNECT_IT_PORT:-8421}}"
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},postgres,server,connect-it,sophia-postgres,sophia-server,sophia-connect-it"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},postgres,server,connect-it,sophia-postgres,sophia-server,sophia-connect-it"
    ports:
      - "${SOPHIA_CONNECT_IT_PORT:-8421}:8421"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sophia-network

  web:
    image: sophiaai/web:latest
    container_name: sophia-web
    environment:
      SOPHIA_SERVER_UPSTREAM: ${SOPHIA_SERVER_UPSTREAM:-sophia-server:8080}
      SOPHIA_CHANNEL_UPSTREAM: ${SOPHIA_CHANNEL_UPSTREAM:-sophia-channel:8081}
    ports:
      - "8082:8082"
      # HTTPS + HTTP/2：h2 多路复用可避免多标签页的 SSE 长连接占满浏览器对单
      # origin 的 ~6 条 HTTP/1.1 连接、导致页面卡死（#822）。取消下面两处注释
      # 并放入证书后自动启用（自签 / mkcert / Let's Encrypt 均可）。
      # - "8443:8443"
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro   # 需包含 server.crt 与 server.key
    depends_on:
      server:
        condition: service_healthy
      channel:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sophia-network

volumes:
  postgres_data:
    driver: local
  pgvector_data:
    driver: local
  containerd_data:
    driver: local
  memoh_data:
    driver: local
  server_cni_state:
    driver: local
  openviking_data:
    driver: local

networks:
  sophia-network:
    driver: bridge
