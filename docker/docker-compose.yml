name: "sophia"
services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      args:
        - VERSION=${SOPHIA_VERSION:-dev}
        - COMMIT_HASH=${SOPHIA_COMMIT:-unknown}
        - BUILD_TIME=${SOPHIA_BUILD_TIME:-unknown}

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      args:
        - VERSION=${SOPHIA_VERSION:-dev}
        - COMMIT_HASH=${SOPHIA_COMMIT:-unknown}
        - BUILD_TIME=${SOPHIA_BUILD_TIME:-unknown}

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
